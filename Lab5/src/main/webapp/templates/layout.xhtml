<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>CarRental</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

    <!-- ШАПКА -->
    <div class="header">
        <h:graphicImage library="images" name="logo.png" style="height:50px"/>
        <span class="company-name">CarRental</span>
        <span class="username">
            <ui:insert name="username">
                #{authBean.currentUser != null ? authBean.currentUser.name : ''}
            </ui:insert>
        </span>
    </div>

    <!-- СОДЕРЖИМОЕ -->
    <div class="content">
        <ui:insert name="content">
            Добро пожаловать!
        </ui:insert>
    </div>

    <!-- ПОДВАЛ -->
    <div class="footer">
        <ui:insert name="footer">
            <p>Телефон: 8-800-555-35-35</p>
            <p>Email: info@carrental.ru</p>
        </ui:insert>
    </div>

</h:body>
</html>
