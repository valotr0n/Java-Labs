<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/templates/layout.xhtml">

    <ui:define name="content">
        <div class="form-container">
            <h2>Авторизация</h2>

            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="Email"/>
                    <h:inputText value="#{authBean.email}" required="true"/>

                    <h:outputText value="Пароль"/>
                    <h:inputSecret value="#{authBean.password}" required="true"/>
                </h:panelGrid>

                <br/>
                <h:outputText value="#{authBean.errorMessage}"
                              style="color: red"
                              rendered="#{not empty authBean.errorMessage}"/>
                <br/>

                <h:commandButton value="Войти"
                                 action="#{authBean.login()}"
                                 styleClass="btn"/>
            </h:form>

            <p>Нет аккаунта?
                <h:outputLink value="#{request.contextPath}/pages/register.xhtml">
                    Зарегистрироваться
                </h:outputLink>
            </p>
        </div>
    </ui:define>

</ui:composition>
</html>
